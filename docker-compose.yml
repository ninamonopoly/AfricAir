# Docker module — uses Node.js backend + Postgres container
# Used when teaching Docker: build, containerisation, networking, volumes
# For the Kubernetes module (Python + RDS), see docker-compose.python.yml

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: africair
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: africair
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U africair"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - config/staging.env
    environment:
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: africair
      PGUSER: africair
      PGPASSWORD_FILE: /run/secrets/db_password
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      PROMO_CODES_FILE: /run/secrets/promo_codes
      MIGRATE_ON_START: "true"
    ports:
      - "4000:4000"
    secrets:
      - db_password
      - admin_token
      - promo_codes
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend-node
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/employees
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

secrets:
  db_password:
    file: ./secrets/db_password
  admin_token:
    file: ./secrets/admin_token
  promo_codes:
    file: ./secrets/promo_codes

volumes:
  postgres-data:
