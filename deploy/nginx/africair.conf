# /etc/nginx/sites-available/africair
# Install:
#   sudo cp deploy/nginx/africair.conf /etc/nginx/sites-available/africair
#   sudo ln -s /etc/nginx/sites-available/africair /etc/nginx/sites-enabled/africair
#   sudo nginx -t && sudo systemctl reload nginx

log_format africair_json escape=json
    '{"time":"$time_iso8601"'
    ',"remote_addr":"$remote_addr"'
    ',"method":"$request_method"'
    ',"uri":"$request_uri"'
    ',"status":$status'
    ',"bytes_sent":$bytes_sent'
    ',"request_time":$request_time'
    ',"referrer":"$http_referer"'
    ',"user_agent":"$http_user_agent"'
    ',"x_forwarded_for":"$http_x_forwarded_for"'
    '}';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/africair/current;
    index index.html;

    access_log /var/log/nginx/africair.access.json africair_json;

    # Gzip compression for text-based assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Hashed assets — cache forever (content-addressed, safe to cache indefinitely)
    location ~* ^/assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # /healthz — inline 200 OK, never logged (kubelet/load-balancer probe)
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "ok\n";
    }

    # version.json — revalidate on every request (smoke-tested on every deploy)
    location = /version.json {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Proxy /api/* to the Node API on port 4000
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # SPA fallback — all other paths serve index.html (hash routing)
    location / {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
